name: Backend PR Validation

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/backend-pr-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: backend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      # mongodb-memory-server downloads a ~200MB MongoDB binary on first run.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: backend/node_modules/.cache/mongodb-memory-server
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/yarn.lock') }}

      - name: E2E tests
        run: yarn test:e2e

      - name: Build
        run: yarn build
